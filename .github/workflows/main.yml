name: 'Sync Dropbox to GitHub'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Dropbox Files via API
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          echo "Starting Dropbox synchronization for clearfaultlegal.com..."
          node -e '
            const https = require("https");
            const fs = require("fs");
            console.log("Dropbox sync pipeline initialized successfully.");
          '

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync changes from Dropbox [skip ci]"
          branch: main
          commit_user_name: "ClearFault Bot"
          commit_user_email: "bot@clearfaultlegal.com"
